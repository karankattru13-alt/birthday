<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Her Photo Universe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Italiana&family=Cormorant+Garamond:ital,wght@1,500&family=Figtree:wght@400;500;600&family=Caveat:wght@500;700&display=swap">
<style>
/* Layout: one full-screen night scene. A gift opens, the photos become a floating 3D world that can be spun and reshaped. */
:root {
  --night: #0c1029;
  --ink: #f4effb;
  --muted: #a7a9cc;
  --gold: #ffd58a;
  --rose: #f7a6b0;
  --paper: #fbf6ef;
  --display: "Gloock", Georgia, "Times New Roman", serif;
  --script: "Pinyon Script", "Snell Roundhand", "Apple Chancery", cursive;
  --caps: "Italiana", "Didot", Georgia, serif;
  --serif-it: "Cormorant Garamond", Georgia, serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; background: var(--night); color: var(--ink); overflow: hidden; }
body {
  font-family: var(--body);
  background: #03040a;
  user-select: none; -webkit-user-select: none;
}
#sky { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.milky { position: fixed; left: -30%; right: -30%; top: 30%; height: 46%; pointer-events: none; transform: rotate(-24deg); filter: blur(28px); opacity: .55;
  background:
    radial-gradient(ellipse 30% 40% at 30% 50%, rgba(170, 120, 230, .35), transparent 70%),
    radial-gradient(ellipse 25% 35% at 55% 45%, rgba(255, 190, 210, .22), transparent 70%),
    radial-gradient(ellipse 35% 45% at 75% 55%, rgba(90, 150, 230, .28), transparent 70%),
    radial-gradient(ellipse 60% 22% at 50% 50%, rgba(255, 240, 220, .12), transparent 75%); }
#gal { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }

/* Gift intro */
.intro { position: fixed; inset: 0; display: grid; place-items: center; z-index: 20; transition: opacity .8s ease; }
.intro.gone { opacity: 0; pointer-events: none; }
.intro-in { display: grid; justify-items: center; gap: 26px; text-align: center; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
.intro .for { font-family: var(--hand); font-size: 28px; color: var(--gold); }
.gift { position: relative; width: 150px; height: 140px; border: 0; background: none; cursor: pointer; padding: 0; animation: bob 3s ease-in-out infinite; }
.gift:focus-visible { outline: 2px solid var(--gold); outline-offset: 10px; border-radius: 12px; }
.box { position: absolute; left: 10px; right: 10px; bottom: 0; height: 92px; border-radius: 8px; background: linear-gradient(160deg, #f7a6b0, #d9708a); box-shadow: 0 20px 50px rgba(247,166,176,.35); }
.lid { position: absolute; left: 0; right: 0; top: 18px; height: 34px; border-radius: 8px; background: linear-gradient(160deg, #ffc0c8, #e57f98); transition: transform .7s cubic-bezier(.3,1.6,.5,1); transform-origin: 20% 100%; }
.ribbon-v { position: absolute; left: 50%; width: 20px; margin-left: -10px; top: 18px; bottom: 0; background: var(--gold); }
.bow { position: absolute; top: -4px; left: 50%; width: 64px; height: 30px; margin-left: -32px; }
.bow::before, .bow::after { content: ""; position: absolute; top: 4px; width: 28px; height: 22px; border: 6px solid var(--gold); border-radius: 50% 50% 50% 50%; }
.bow::before { left: 0; transform: rotate(-20deg); }
.bow::after { right: 0; transform: rotate(20deg); }
.gift.open .lid, .gift.open .bow { transform: translate(-30px, -90px) rotate(-35deg); opacity: 0; transition: transform .7s ease, opacity .7s ease .2s; }
.gift.open .bow { transform: translate(-30px, -110px) rotate(-35deg); }
.intro .tap { color: var(--muted); font-size: 13px; letter-spacing: .22em; text-transform: uppercase; }
@keyframes bob { 50% { transform: translateY(-10px) rotate(-1.5deg); } }

/* Scene */
.title {
  position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: 0; right: 0; z-index: 10; text-align: center; pointer-events: none;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  opacity: 0; transform: translateY(-12px); transition: opacity 1.4s ease 1s, transform 1.4s ease 1s;
}
.kicker {
  display: flex; align-items: center; justify-content: center; gap: 14px;
  font-family: var(--caps); text-transform: uppercase; letter-spacing: .62em; padding-left: .62em;
  font-size: clamp(13px, 3.4vw, 19px); color: #f7e8cc;
}
.kicker::before, .kicker::after { content: ""; width: clamp(24px, 8vw, 60px); height: 1px; background: linear-gradient(90deg, transparent, var(--gold)); }
.kicker::after { background: linear-gradient(270deg, transparent, var(--gold)); margin-left: -.62em; }
.title h1 {
  margin: -.08em 0 0; padding: 0 .2em .06em; font-family: var(--script); font-weight: 400; line-height: 1.05;
  font-size: clamp(66px, 18vw, 148px);
  background: linear-gradient(100deg, #c08a45 0%, #ffe2a3 22%, #fffaf0 38%, #ffd58a 52%, #f0a9b9 72%, #ffe2a3 88%, #c08a45 100%);
  background-size: 260% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 22px rgba(255, 205, 140, .38)) drop-shadow(0 2px 2px rgba(0,0,0,.4));
  animation: shimmer 7s linear infinite;
}
@keyframes shimmer { to { background-position: -260% 0; } }
.title p { margin: -.1em 0 0; font-family: var(--serif-it); font-style: italic; font-weight: 500; font-size: clamp(18px, 4.6vw, 25px); letter-spacing: .05em; color: #f5dbe1; text-shadow: 0 0 18px rgba(247,166,176,.45); }
body.live .title { opacity: 1; transform: none; }

#world { position: fixed; inset: 0; z-index: 5; touch-action: none; cursor: grab; }
#world:active { cursor: grabbing; }
#world { transition: opacity .6s ease; }
#world.off { opacity: 0; pointer-events: none; }
#watchScene { position: fixed; inset: 0; z-index: 6; display: grid; place-items: center; opacity: 0; pointer-events: none; transition: opacity .7s ease; overflow: hidden; }
#watchScene.on { opacity: 1; pointer-events: auto; }
body, #sky, .milky, #gal { transition: opacity .7s ease, background .7s ease; }
body.watchmode { background: radial-gradient(55% 45% at 50% 44%, #2b2b30 0%, #121214 55%, #000 100%); }
body.watchmode #sky, body.watchmode .milky, body.watchmode #gal { opacity: 0; }
body.watchmode .title { opacity: 0 !important; transition: opacity .4s ease 0s; }
.watch { --ww: min(74vw, 360px, calc((100vh - 220px) * .84)); position: relative; width: var(--ww); margin-top: -40px; }
.band {
  position: absolute; left: 15%; right: 15%; height: 30vh; z-index: -1;
  background: linear-gradient(90deg, #c99693 0%, #e9bdb9 18%, #f3cfcb 50%, #e9bdb9 82%, #c99693 100%);
}
.band::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(180deg, transparent 0 34px, rgba(0,0,0,.06) 34px 36px); }
.band.top { bottom: 92%; border-radius: 4px 4px 18px 18px; -webkit-mask-image: linear-gradient(to top, #000 30%, transparent); mask-image: linear-gradient(to top, #000 30%, transparent); }
.band.bottom { top: 92%; border-radius: 18px 18px 4px 4px; -webkit-mask-image: linear-gradient(to bottom, #000 30%, transparent); mask-image: linear-gradient(to bottom, #000 30%, transparent); }
.case {
  position: relative; width: 100%; aspect-ratio: .84; border-radius: 27% / 23%; padding: 6.2%;
  background: linear-gradient(145deg, #4a4a50 0%, #1c1c1f 35%, #0e0e10 60%, #3a3a3f 100%);
  box-shadow: 0 40px 80px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.08), inset 0 1px 1px rgba(255,255,255,.25), inset 0 -2px 6px rgba(0,0,0,.6);
}
.crown {
  position: absolute; right: -4.6%; top: 20%; width: 6.5%; height: 15%; border-radius: 3px 6px 6px 3px;
  background: repeating-linear-gradient(180deg, #5a5a60 0 2px, #2a2a2e 2px 4px); box-shadow: inset -2px 0 3px rgba(0,0,0,.6);
}
.crown::after { content: ""; position: absolute; right: -14%; top: 22%; width: 30%; height: 56%; border-radius: 0 3px 3px 0; background: #d9706b; }
.sidebtn { position: absolute; right: -2.4%; top: 45%; width: 3.4%; height: 22%; border-radius: 0 4px 4px 0; background: linear-gradient(90deg, #1a1a1d, #45454b); }
.screen { position: relative; width: 100%; height: 100%; border-radius: 23% / 19%; background: #000; overflow: hidden; touch-action: none; cursor: grab; box-shadow: inset 0 0 0 1px rgba(255,255,255,.04); }
.screen::after { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit; background: linear-gradient(130deg, rgba(255,255,255,.08) 0%, transparent 32%); }
.wclock { position: absolute; top: 6%; right: 12%; z-index: 2; pointer-events: none; color: #fff; font: 600 clamp(13px, 4.6vw, 18px) -apple-system, "SF Pro Text", system-ui, sans-serif; font-variant-numeric: tabular-nums; text-shadow: 0 1px 6px #000; }
.bub {
  position: absolute; left: 0; top: 0; width: var(--b); height: var(--b); border-radius: 50%; overflow: hidden;
  background: #1c2048; box-shadow: inset 0 0 0 1px rgba(255,255,255,.1);
  will-change: transform, opacity; cursor: pointer;
}
.bub img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; display: block; pointer-events: none; -webkit-user-drag: none; }
.bub::after { content: ""; position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(255, 213, 138, 0); transition: box-shadow .4s; }
.bub.center::after { box-shadow: inset 0 0 0 3px rgba(255, 213, 138, .9), inset 0 0 18px rgba(255, 213, 138, .35); }
.card {
  position: absolute; left: 0; top: 0; width: var(--w); height: calc(var(--w) * 1.25);
  padding: 3px; background: var(--paper); border-radius: 3px;
  box-shadow: 0 8px 22px rgba(0,0,0,.45);
  will-change: transform, opacity; pointer-events: auto; cursor: pointer;
}
.card img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 1px; pointer-events: none; -webkit-user-drag: none; }

.dock {
  position: fixed; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 10;
  display: grid; justify-items: center; gap: 10px;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  opacity: 0; transition: opacity 1s ease 1.8s; pointer-events: none;
}
body.live .dock { opacity: 1; pointer-events: auto; }
.shapes { display: flex; gap: 6px; padding: 5px; border-radius: 999px; background: rgba(16, 18, 48, .78); border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.shapes button {
  border: 0; border-radius: 999px; padding: 10px clamp(11px, 3.2vw, 18px); min-height: 42px; cursor: pointer;
  font: 600 14px var(--body); color: var(--ink); background: transparent; transition: background .3s, color .3s;
}
.shapes button[aria-pressed="true"] { background: var(--gold); color: var(--night); }
.shapes button:focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }
.hint { color: var(--muted); font-size: 12px; letter-spacing: .08em; text-align: center; }

.note {
  position: fixed; left: 50%; bottom: calc(118px + env(safe-area-inset-bottom, 0px)); z-index: 10; transform: translateX(-50%);
  font-family: var(--hand); font-size: clamp(24px, 5.5vw, 34px); color: #fff; text-align: center; width: min(80vw, 340px);
  text-shadow: 0 2px 20px rgba(247,166,176,.8); pointer-events: none; opacity: 0; transition: opacity 1s ease;
}
.note.show { opacity: 1; }

/* Viewer */
.viewer {
  position: fixed; inset: 0; z-index: 50; background: rgba(6, 8, 22, .985);
  display: grid; grid-template-rows: auto 1fr auto;
  padding: calc(10px + env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));
}
.vtop { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; padding: 4px 6px; }
.vstage { position: relative; display: grid; place-items: center; min-height: 0; touch-action: pan-y; }
.vstage { overflow: hidden; }
.vstage img { position: absolute; inset: 0; margin: auto; width: auto; height: auto; max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px; box-shadow: 0 30px 80px rgba(0,0,0,.6); transition: opacity .25s, transform .25s; }
@keyframes pop { from { transform: scale(.22); border-radius: 50%; opacity: .5; } }
.vstage img.pop { animation: pop .55s cubic-bezier(.2,.9,.3,1.15); }
.vstage img.swap { opacity: 0; transform: scale(.97); }
.vbtns { display: flex; justify-content: center; gap: 12px; padding-top: 12px; }
.vb { min-width: 48px; min-height: 48px; border-radius: 999px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06); color: var(--ink); font: 600 15px var(--body); cursor: pointer; padding: 0 18px; }
.vb.gold { background: var(--gold); color: var(--night); border-color: transparent; }
.vb:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

@media (prefers-reduced-motion: reduce) { .gift, .title h1 { animation: none; } }
</style>

<body>

<canvas id="sky" aria-hidden="true"></canvas>
<canvas id="gal" aria-hidden="true"></canvas>

<div class="intro" id="intro">
  <div class="intro-in">
    <div class="for">something made just for you</div>
    <button class="gift" id="gift" type="button" aria-label="Open your gift">
      <span class="box"></span><span class="ribbon-v"></span><span class="lid"></span><span class="bow"></span>
    </button>
    <div class="tap">Tap to open</div>
  </div>
</div>

<div class="title"><div class="kicker">Happy</div><h1>Birthday</h1><p>a whole universe of you</p></div>
<div id="world" aria-label="Your photos, floating in 3D. Drag to spin, tap a photo to open it."></div>
<div id="watchScene">
  <div class="watch">
    <div class="band top"></div><div class="band bottom"></div>
    <div class="case">
      <div class="screen" id="honey" aria-label="Your photos as bubbles on a watch. Drag to explore, tap one to open it."><div class="wclock" id="wclock"></div></div>
      <div class="crown"></div><div class="sidebtn"></div>
    </div>
  </div>
</div>
<div class="note" id="note">Every single one of these is my favourite.</div>

<div class="dock">
  <div class="shapes" role="group" aria-label="Arrange photos">
    <button type="button" data-shape="planet" aria-pressed="true">Planet</button>
    <button type="button" data-shape="heart" aria-pressed="false">Heart</button>
    <button type="button" data-shape="galaxy" aria-pressed="false">Galaxy</button>
    <button type="button" data-shape="bubbles" aria-pressed="false">Bubbles</button>
  </div>
  <div class="hint" id="hint">Drag to spin · tap a photo to open it</div>
</div>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
  <div class="vtop"><span id="vcount"></span><button class="vb" id="vclose" type="button">Close</button></div>
  <div class="vstage" id="vstage"><img id="vimg" alt=""></div>
  <div class="vbtns">
    <button class="vb" id="vprev" type="button" aria-label="Previous photo">←</button>
    <button class="vb gold" id="vnext" type="button" aria-label="Next photo">→</button>
  </div>
</div>

<script>
const N = 89;
const pad = n => String(n).padStart(2, "0");
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
const world = document.getElementById("world");

/* Build cards */
const cards = [];
for (let i = 0; i < N; i++) {
  const c = document.createElement("div");
  c.className = "card";
  c.dataset.i = i;
  c.innerHTML = `<img src="photos/s${pad(i + 1)}.jpg" alt="Photo ${i + 1}" decoding="async">`;
  world.appendChild(c);
  cards.push({ el: c, x: 0, y: 0, z: 0, tx: 0, ty: 0, tz: 0, sx: 0, sy: 0, sz: 0, delay: Math.random() * 0.5 });
}

/* Shapes (unit space, roughly -1..1) */
function planet() {
  const g = Math.PI * (3 - Math.sqrt(5));
  return cards.map((_, i) => {
    const y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(1 - y * y), t = g * i;
    return [Math.cos(t) * r, y, Math.sin(t) * r];
  });
}
function heart() {
  const rings = [[48, 1], [27, .66], [14, .32]];
  const pts = [];
  rings.forEach(([n, s], k) => {
    for (let j = 0; j < n && pts.length < N; j++) {
      const t = (j / n) * Math.PI * 2 + k * .3;
      const x = 16 * Math.sin(t) ** 3;
      const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      pts.push([x / 15 * s, (-y / 15 * s) + .05, (k - 1) * .12 + (Math.random() - .5) * .08]);
    }
  });
  return pts;
}
const ARMS = 3, TWIST = Math.PI * 2.6;
function armPoint(arm, f) {
  const a = f * TWIST + arm * (Math.PI * 2 / ARMS), r = .14 + f * .98;
  return [Math.cos(a) * r, Math.sin(a) * r];
}
function galaxy() {
  return cards.map((_, i) => {
    const arm = i % ARMS, f = (Math.floor(i / ARMS) + .5) / Math.ceil(N / ARMS);
    const [x, z] = armPoint(arm, f);
    return [x, (Math.random() - .5) * .06, z];
  });
}
/* Star particles that make up the galaxy */
const GAL = [];
(function buildGalaxy() {
  const n = innerWidth < 600 ? 2200 : 4200;
  const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;
  for (let i = 0; i < n; i++) {
    let x, y, z, col, size;
    const roll = Math.random();
    if (roll < .22) { // bulge
      const r = Math.abs(gauss()) * .22;
      const a = Math.random() * 6.283;
      x = Math.cos(a) * r; z = Math.sin(a) * r; y = gauss() * .07 * (1 - r * 2);
      col = [255, 226 + Math.random() * 20, 180 + Math.random() * 40]; size = Math.random() * 2.2 + 1;
    } else if (roll < .9) { // arms
      const f = Math.pow(Math.random(), .8), arm = Math.floor(Math.random() * ARMS);
      const [ax, az] = armPoint(arm, f);
      const spread = .03 + f * .13;
      x = ax + gauss() * spread; z = az + gauss() * spread; y = gauss() * .03;
      const t = Math.random();
      col = t < .55 ? [170 + f * 40, 200, 255] : t < .8 ? [255, 255, 255] : t < .93 ? [255, 150, 200] : [255, 210, 150];
      size = Math.random() * 2 + .9;
    } else { // halo dust
      const r = Math.random() * 1.25, a = Math.random() * 6.283;
      x = Math.cos(a) * r; z = Math.sin(a) * r; y = gauss() * .12;
      col = [200, 190, 255]; size = Math.random() * 1.2 + .6;
    }
    GAL.push({ x, y, z, c: `rgb(${col.map(v => Math.round(v)).join(",")})`, s: size, tw: Math.random() * 6.28 });
  }
})();
const NEB = Array.from({ length: 70 }, (_, i) => {
  const f = .15 + Math.random() * .85, [x, z] = armPoint(i % ARMS, f);
  const t = Math.random();
  return { x: x + (Math.random() - .5) * .08, y: 0, z: z + (Math.random() - .5) * .08, r: .07 + Math.random() * .12,
    c: t < .45 ? "120,150,255" : t < .8 ? "235,110,190" : "170,110,240" };
});
let galAlpha = 0, cardMul = 1, radMul = 1, CY = innerHeight / 2;
const gal = document.getElementById("gal"), gctx = gal.getContext("2d");
function sizeGal() { const d = Math.min(2, devicePixelRatio || 1); gal.width = innerWidth * d; gal.height = innerHeight * d; gctx.setTransform(d, 0, 0, d, 0, 0); }
sizeGal(); addEventListener("resize", sizeGal);
function drawGalaxy(t, cx, sx, cy, sy, R, P, W, H) {
  galAlpha += ((shape === "galaxy" ? 1 : 0) - galAlpha) * 0.035;
  gctx.clearRect(0, 0, W, H);
  if (galAlpha < 0.01) return;
  const ox = W / 2, oy = CY, Rg = R;
  gctx.globalCompositeOperation = "lighter";
  // glowing core
  const core = gctx.createRadialGradient(ox, oy, 0, ox, oy, Rg * .45);
  core.addColorStop(0, `rgba(255,240,215,${.85 * galAlpha})`);
  core.addColorStop(.18, `rgba(255,200,150,${.35 * galAlpha})`);
  core.addColorStop(.55, `rgba(170,110,220,${.12 * galAlpha})`);
  core.addColorStop(1, "rgba(0,0,0,0)");
  gctx.save(); gctx.translate(ox, oy); gctx.scale(1, Math.max(.25, Math.abs(Math.cos(rx)))); gctx.translate(-ox, -oy);
  gctx.fillStyle = core; gctx.fillRect(ox - Rg, oy - Rg, Rg * 2, Rg * 2); gctx.restore();
  for (const n of NEB) {
    let x = n.x * cy - n.z * sy, z = n.x * sy + n.z * cy, y = n.y;
    const y2 = y * cx - z * sx; z = y * sx + z * cx; y = y2;
    const k = P / (P - z * Rg), px = ox + x * Rg * k, py = oy + y * Rg * k, rr = n.r * Rg * k;
    const g = gctx.createRadialGradient(px, py, 0, px, py, rr);
    g.addColorStop(0, `rgba(${n.c},${.16 * galAlpha})`); g.addColorStop(1, `rgba(${n.c},0)`);
    gctx.fillStyle = g; gctx.fillRect(px - rr, py - rr, rr * 2, rr * 2);
  }
  for (const p of GAL) {
    let x = p.x * cy - p.z * sy, z = p.x * sy + p.z * cy, y = p.y;
    const y2 = y * cx - z * sx; z = y * sx + z * cx; y = y2;
    const k = P / (P - z * Rg);
    gctx.globalAlpha = galAlpha * (.6 + .4 * Math.sin(t / 600 + p.tw)) * (.65 + .35 * (z + 1) / 2);
    gctx.fillStyle = p.c;

const SHAPES = { planet, heart, galaxy };
let shape = "planet", morphT = 1;

function setShape(name) {
  shape = name;
  const bubbles = name === "bubbles";
  world.classList.toggle("off", bubbles);
  setHoney(bubbles);
  document.getElementById("hint").textContent = bubbles ? "Drag to explore · tap a bubble to open it" : "Drag to spin · tap a photo to open it";
  if (bubbles) {
    document.querySelectorAll(".shapes button").forEach(b => b.setAttribute("aria-pressed", b.dataset.shape === name));
    document.getElementById("note").classList.remove("show");
    return;
  }
  const pts = SHAPES[name]();
  cards.forEach((c, i) => { c.sx = c.x; c.sy = c.y; c.sz = c.z; [c.tx, c.ty, c.tz] = pts[i]; });
  morphT = 0;
  document.querySelectorAll(".shapes button").forEach(b => b.setAttribute("aria-pressed", b.dataset.shape === name));
  document.getElementById("note").classList.toggle("show", false);
  if (name === "heart") { rx = 0; vy = 0; ry = 0; setTimeout(() => shape === "heart" && document.getElementById("note").classList.add("show"), 1400); }

}
document.querySelectorAll(".shapes button").forEach(b => b.addEventListener("click", () => setShape(b.dataset.shape)));

/* Rotation + drag */
let rx = -0.25, ry = 0, vy = still ? 0 : 0.004, vx = 0, dragging = false, moved = 0, lx = 0, ly = 0, live = false;
world.addEventListener("pointerdown", e => { dragging = true; moved = 0; lx = e.clientX; ly = e.clientY; world.setPointerCapture(e.pointerId); });
world.addEventListener("pointermove", e => {
  if (!dragging) return;
  const dx = e.clientX - lx, dy = e.clientY - ly; lx = e.clientX; ly = e.clientY;
  moved += Math.abs(dx) + Math.abs(dy);
  vy = dx * 0.006; vx = dy * 0.004;
  ry += vy; if (shape !== "heart") rx = Math.max(-1.2, Math.min(1.2, rx + vx));
});
world.addEventListener("pointerup", e => {
  dragging = false;
  if (moved < 8) {
    const hit = document.elementsFromPoint(e.clientX, e.clientY).find(el => el.classList && el.classList.contains("card"));
    if (hit) openViewer(+hit.dataset.i);
  }
});
world.addEventListener("pointercancel", () => dragging = false);

const ease = t => 1 - Math.pow(1 - t, 3);
function frame(t) {
  const W = innerWidth, H = innerHeight;
  const tb = document.querySelector(".title").getBoundingClientRect().bottom, db = document.querySelector(".dock").getBoundingClientRect().top;
  CY = (tb + db) / 2;
  const R = Math.min(W * (W < 600 ? 0.42 : 0.36), (db - tb) / 2 * 0.98);
  const cw = W < 600 ? 46 : 62;
  world.style.setProperty("--w", cw + "px");
  if (morphT < 1) morphT = Math.min(1, morphT + (still ? 1 : 0.012));

  if (!dragging) {
    if (shape === "heart") { ry += (Math.sin(t / 2200) * 0.35 - ry) * 0.04; }
    else { vy += ((still ? 0 : 0.004) - vy) * 0.03; ry += vy; }

  const cy = Math.cos(ry), sy = Math.sin(ry), cx = Math.cos(rx), sx = Math.sin(rx);
  const gm = shape === "galaxy" ? 1 : 0;
  cardMul += ((gm ? (W < 600 ? .52 : .6) : 1) - cardMul) * .05; radMul += ((gm ? (W < 600 ? 1.1 : 1.18) : 1) - radMul) * .05;
  const P = R * 3.2;
  drawGalaxy(t, cx, sx, cy, sy, R * radMul, P, W, H);
  for (const c of cards) {
    const k = ease(Math.max(0, Math.min(1, (morphT - c.delay * 0.4) / 0.6)));
    c.x = c.sx + (c.tx - c.sx) * k; c.y = c.sy + (c.ty - c.sy) * k; c.z = c.sz + (c.tz - c.sz) * k;
    let x = c.x * cy - c.z * sy, z = c.x * sy + c.z * cy, y = c.y;
    const y2 = y * cx - z * sx; z = y * sx + z * cx; y = y2;

    const px = W / 2 + x * RR * s - cw / 2, py = CY + y * RR * s - cw * .625;
    c.el.style.transform = `translate3d(${px.toFixed(1)}px,${py.toFixed(1)}px,0) scale(${(s * (0.75 + z * .15) * cardMul).toFixed(3)})`;
    c.el.style.opacity = (0.3 + 0.7 * (z + 1) / 2).toFixed(2);

}

/* Apple Watch style honeycomb */
const honey = document.getElementById("honey");
const HEX = (function hexSpiral(n) {

  const el = document.createElement("div");
  el.className = "bub"; el.dataset.i = i;
  el.innerHTML = `<img src="photos/s${pad(i + 1)}.jpg" alt="Photo ${i + 1}" decoding="async">`;
  honey.appendChild(el);
  return { el, q, r, ring };
});
let honeyOn = false, honeyStart = 0, panX = 0, panY = 0, hvx = 0, hvy = 0, hdrag = false, hmoved = 0, hlx = 0, hly = 0, lastTouch = 0, centerEl = null;
function setHoney(on) {
  if (on === honeyOn) return;
  honeyOn = on; document.getElementById("watchScene").classList.toggle("on", on); document.body.classList.toggle("watchmode", on);
  if (on) { honeyStart = performance.now(); panX = panY = hvx = hvy = 0; lastTouch = honeyStart; requestAnimationFrame(honeyFrame); }
}
honey.addEventListener("pointerdown", e => { hdrag = true; hmoved = 0; hlx = e.clientX; hly = e.clientY; hvx = hvy = 0; lastTouch = performance.now(); honey.setPointerCapture(e.pointerId); });
honey.addEventListener("pointermove", e => {
  if (!hdrag) return;
  const dx = e.clientX - hlx, dy = e.clientY - hly; hlx = e.clientX; hly = e.clientY;
  hmoved += Math.abs(dx) + Math.abs(dy); panX += dx; panY += dy; hvx = dx; hvy = dy; lastTouch = performance.now();
});
honey.addEventListener("pointerup", e => {
  hdrag = false; lastTouch = performance.now();
  if (hmoved < 8) {
    const hit = document.elementsFromPoint(e.clientX, e.clientY).find(el => el.classList && el.classList.contains("bub"));
    if (hit) openViewer(+hit.dataset.i, true);
  }
});
honey.addEventListener("pointercancel", () => hdrag = false);
honey.addEventListener("wheel", e => { e.preventDefault(); panX -= e.deltaX * .6; panY -= e.deltaY * .6; lastTouch = performance.now(); }, { passive: false });
const backOut = x => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
function honeyFrame(t) {

}

/* Open the gift */
const gift = document.getElementById("gift");
gift.addEventListener("click", () => {
  gift.classList.add("open");
  setTimeout(() => {
    document.getElementById("intro").classList.add("gone");
    document.body.classList.add("live");
    cards.forEach(c => { c.x = c.sx = (Math.random() - .5) * .05; c.y = c.sy = .1; c.z = c.sz = 0; });
    live = true; setShape("planet"); requestAnimationFrame(frame);
  }, still ? 50 : 650);
});
/* Before opening, park cards out of sight */
cards.forEach(c => { c.el.style.opacity = 0; });

/* Viewer */
const viewer = document.getElementById("viewer"), vimg = document.getElementById("vimg"), vcount = document.getElementById("vcount");
let cur = 0, popNext = false;
function show(i) {
  cur = (i + N) % N;
  vimg.classList.add("swap");
  const src = `photos/p${pad(cur + 1)}.jpg`, pre = new Image();
  pre.onload = pre.onerror = () => { vimg.src = src; vimg.alt = `Photo ${cur + 1}`; vimg.classList.remove("swap"); if (popNext) { vimg.classList.remove("pop"); void vimg.offsetWidth; vimg.classList.add("pop"); popNext = false; } };
  pre.src = src;
  vcount.textContent = `${cur + 1} / ${N}`;
  new Image().src = `photos/p${pad(((cur + 1) % N) + 1)}.jpg`;
}
function openViewer(i, pop) { popNext = !!pop; viewer.hidden = false; show(i); document.getElementById("vnext").focus(); }
function closeViewer() { viewer.hidden = true; }
document.getElementById("vclose").onclick = closeViewer;
document.getElementById("vprev").onclick = () => show(cur - 1);
document.getElementById("vnext").onclick = () => show(cur + 1);
addEventListener("keydown", e => {
  if (viewer.hidden) return;
  if (e.key === "Escape") closeViewer();
  if (e.key === "ArrowRight") show(cur + 1);
  if (e.key === "ArrowLeft") show(cur - 1);
});
const stage = document.getElementById("vstage");
let tsx = null, tsy = null;
stage.addEventListener("touchstart", e => { tsx = e.touches[0].clientX; tsy = e.touches[0].clientY; }, { passive: true });
stage.addEventListener("touchend", e => {
  if (tsx === null) return;
  const dx = e.changedTouches[0].clientX - tsx, dy = e.changedTouches[0].clientY - tsy;
  if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) show(cur + (dx < 0 ? 1 : -1));
  else if (dy > 90) closeViewer();
  tsx = null;
});
stage.addEventListener("click", e => { if (e.target === stage) closeViewer(); });

/* Sky: procedural Milky Way and star field, rendered once per size */
(function sky() {
  const c = document.getElementById("sky"), ctx = c.getContext("2d");
  let base = null, twinklers = [], shoot = null, W = 0, H = 0;

  // value noise + fbm
  const P = new Uint8Array(512); { const p = [...Array(256).keys()]; for (let i = 255; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; } for (let i = 0; i < 512; i++) P[i] = p[i & 255]; }
  const fade = t => t * t * (3 - 2 * t);
  function vnoise(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const h = (a, b) => P[(P[(xi + a) & 255] + yi + b) & 511] / 255;
    const u = fade(xf), v = fade(yf);
    return (h(0, 0) * (1 - u) + h(1, 0) * u) * (1 - v) + (h(0, 1) * (1 - u) + h(1, 1) * u) * v;
  }
  function fbm(x, y, o = 5) { let s = 0, a = .5, f = 1; for (let i = 0; i < o; i++) { s += a * vnoise(x * f, y * f); f *= 2.03; a *= .5; } return s; }

  const ANG = -0.42; // band tilt
  const band = (x, y) => { // signed distance from band centre line, in units of screen diagonal
    const cx = x - W * .5, cy = y - H * .52;
    return (-Math.sin(ANG) * cx + Math.cos(ANG) * cy) / Math.hypot(W, H);
  };
  const along = (x, y) => (Math.cos(ANG) * (x - W * .5) + Math.sin(ANG) * (y - H * .52)) / Math.hypot(W, H);

  function build() {
    const dpr = Math.min(2, devicePixelRatio || 1);

    base = document.createElement("canvas"); base.width = W * dpr; base.height = H * dpr;

      glow *= 1 - .75 * lane * Math.max(0, n2 - .35) * 2.2;

      const neb = Math.max(0, fbm(x * sc * 1.4 + 90, y * sc * 1.4 + 3, 4) - .62) * 4 * env;
      const i = (y * lw + x) * 4;

    const total = Math.round(W * H / 260);

    for (let k = 0; k < total; k++) {
      let x = Math.random() * W, y = Math.random() * H;
      const v = band(x, y);
      if (Math.random() > .25 + .75 * Math.exp(-(v * v) / (2 * .12 * .12))) { x = Math.random() * W; y = Math.random() * H; }

      b.beginPath(); b.arc(x, y, r, 0, 6.283); b.fill();

  requestAnimationFrame(f);
})();
